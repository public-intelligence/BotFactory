# Single-node LiveKit. Keys come from the LIVEKIT_KEYS env var (see compose).
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  # Discover this host's public address by STUN (stun1.l.google.com). Needs
  # working DNS and outbound UDP inside the container; where either is blocked
  # LiveKit fails RTC validation and restart-loops on
  #   "could not validate RTC config: could not resolve external IP".
  #
  # On a host with a known public address, prefer pinning it — no discovery, no
  # dependency on egress. Set use_external_ip to false and uncomment node_ip:
  #
  #   use_external_ip: false
  #   node_ip: <this server's PUBLIC ip>
  #
  # node_ip must be the address browsers reach. Behind NAT or a load balancer
  # that is not what `ip addr` shows, and a private address here produces ICE
  # candidates that connect but carry no audio.
  use_external_ip: true
  tcp_port: 7881
