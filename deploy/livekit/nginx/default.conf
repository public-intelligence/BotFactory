# nginx en frente del señalamiento de LiveKit.
#
# Este archivo es de Bot Factory y se reemplaza en cada actualización. Su
# dominio y su certificado van en site.inc, que no tocamos.
#
# site.inc no termina en .conf a propósito: nginx carga automáticamente
# conf.d/*.conf, y ese archivo debe incluirse dentro de cada bloque server,
# no cargarse suelto.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    include /etc/nginx/conf.d/site.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2  on;
    include /etc/nginx/conf.d/site.inc;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # /rtc es el WebSocket de señalamiento, /twirp la API servidor-a-servidor,
    # / la respuesta de salud.
    location / {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El socket de señalamiento vive lo que dure la llamada.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
