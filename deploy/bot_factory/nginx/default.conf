# nginx del servidor de aplicación: sirve la SPA y hace de proxy hacia la API.
#
# Este archivo es de Bot Factory y se reemplaza en cada actualización. Su
# dominio y su certificado van en site.inc, que no tocamos.
#
# site.inc no termina en .conf a propósito: nginx carga automáticamente
# conf.d/*.conf, y ese archivo debe incluirse dentro de cada bloque server.

# Esquema real del navegador cuando hay otro proxy delante. La API arma con esto
# las URLs absolutas que devuelve (por ejemplo la de inicio de sesión).
map $http_x_forwarded_proto $fwd_proto {
    default            $scheme;
    "~*^(https|http)$" $http_x_forwarded_proto;
}

# "upgrade" solo en peticiones WebSocket; en el resto "close", o se rompe el
# keep-alive contra la API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2  on;
    include /etc/nginx/conf.d/site.inc;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Mandar a HTTPS solo cuando el navegador llegó de verdad por HTTP.
    #
    # Un solo bloque para :80 y :443 a propósito. Cuando otro proxy termina TLS
    # delante (el nginx del servidor de LiveKit, que es la topología que este
    # mismo script recomienda), la petición entra por :80 con
    # X-Forwarded-Proto: https. Redirigir ahí devuelve al navegador a la misma
    # URL, el proxy vuelve a entrar por :80, y el navegador acaba en
    # ERR_TOO_MANY_REDIRECTS: el sitio queda caído para todo el mundo. $fwd_proto
    # es el esquema real del navegador, así que redirigimos por eso y no por el
    # puerto de llegada.
    #
    # El proxy de delante DEBE enviar X-Forwarded-Proto: https. Sin esa cabecera
    # esto no puede distinguir un navegador en texto plano de una petición ya
    # cifrada, y el bucle vuelve.
    if ($fwd_proto = http) {
        return 301 https://$host$request_uri;
    }

    root  /srv;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/xml application/xml text/javascript image/svg+xml;

    # Configuración de la SPA, escrita al arrancar el contenedor. No debe
    # cachearse, o tras un cambio se sigue sirviendo la anterior.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://bf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
    }

    # Buzón de soporte: el script de diagnóstico publica sus logs aquí y la API
    # los reenvía al buzón real. Ruta propia fuera de /api a propósito.
    location = /v0/api/logs {
        proxy_pass http://bf-api:8080/api/logs/upload$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 10m;
        proxy_read_timeout 300s;
    }

    # SignalR: upgrade a WebSocket y sin buffering, para que los mensajes
    # lleguen en el momento.
    location /hubs/ {
        proxy_pass http://bf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Archivos reales, luego directorios (así se sirve /deploy/), y si no,
    # index.html para las rutas de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
