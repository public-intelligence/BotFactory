# Local dev stack: builds frontend, backend, and agent from source.
# Usage:
#   cp .env.production.example .env   # then fill in NPM_TOKEN
#   docker compose up --build
#
# Ports: 4200 frontend, 4201 API, 4202 LiveKit, 4203 agent health, 4204 SQL Server
#        7881 LiveKit TCP, 50000-50100 WebRTC UDP

name: botfactory

x-sa-password: &sa-password "BotFactory@Pass123!"
x-lk-key: &lk-key "devkey"
x-lk-secret: &lk-secret "secretsecretsecretsecretsecretsecret"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.10.1
    ports:
      - "4202:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./apps/agent/livekit.dev.yaml:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      - redis
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sa-password
    volumes:
      - sqldata:/var/lib/mssql/data
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "BotFactory@Pass123!" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./apps
      dockerfile: backend/Dockerfile
    ports:
      - "4201:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BotFactoryDb: "Server=sqlserver,1433;Database=BotFactory;User Id=sa;Password=BotFactory@Pass123!;TrustServerCertificate=true"
      AllowedOrigins: "http://localhost:4200"
      Auth__UseFakeProvider: "true"
      Auth__FakeId__Issuer: bot-factory-dev
      Auth__FakeId__Audience: bot-factory
      Auth__FakeId__SigningKey: "dev-signing-key-at-least-32-chars-long!!"
      LiveKit__Host: "http://livekit:7880"
      LiveKit__PublicHost: "http://localhost:4202"
      AgentCallback__SharedSecret: "dev-agent-callback-secret"
      PublicAccess__SigningKey: "dev-public-signing-key-at-least-32-chars!!"
      Auth__GobId__ApiUrl: "${Auth__GobId__ApiUrl:-https://wa-vuc-dev-gobidapi-dqdrgsb8dyggd7df.eastus2-01.azurewebsites.net}"
      Auth__GobId__Audience: "${Auth__GobId__Audience:-gobid-users}"
      Auth__GobId__LoginBaseUrl: "${Auth__GobId__LoginBaseUrl:-https://proud-mud-04a4e750f.4.azurestaticapps.net}"
      Auth__GobId__ApplicationId: "${Auth__GobId__ApplicationId}"
      Auth__GobId__AppSecret: "${Auth__GobId__AppSecret}"
      LiveKit__ApiKey: *lk-key
      LiveKit__ApiSecret: *lk-secret
      BlobStorage__ConnectionString: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"
      BlobStorage__ContainerName: "kb-documents"
      KbScraper__BaseUrl: "http://kb-scraper:8080"
      KbScraper__ApiKey: "dev-local-key"
      KbScraper__TimeoutSeconds: "45"
      KbScraper__Enabled: "true"
    volumes:
      # File log read back by the /api/logs admin viewer; survives restarts.
      - api_logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      livekit:
        condition: service_started
      azurite:
        condition: service_started
      kb-scraper:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: "${NPM_TOKEN}"
    ports:
      - "4200:80"
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: "http://localhost:4201"
    depends_on:
      - api
    restart: unless-stopped

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    ports:
      - "4203:8089"
    environment:
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: *lk-key
      LIVEKIT_API_SECRET: *lk-secret
      BACKEND_URL: "http://api:8080"
      BACKEND_SHARED_SECRET: "dev-agent-callback-secret"
      AGENT_NAME: bot-factory-agent
      HEALTH_PORT: "8089"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - livekit
    restart: unless-stopped

  kb-scraper:
    platform: linux/amd64
    build:
      context: ./apps/kb-scraper
      dockerfile: Dockerfile
    environment:
      API_KEY: dev-local-key
      MAX_CONCURRENT_RENDERS: "4"
      DEFAULT_TIMEOUT_MS: "45000"
      ACQUIRE_TIMEOUT_MS: "120000"
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  sqldata:
  azurite_data:
  api_logs:
