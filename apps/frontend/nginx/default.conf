# Configuración por defecto horneada en la imagen: HTTP simple en :80.
#
# El despliegue monta su propia configuración sobre /etc/nginx/conf.d (ver
# deploy/bot_factory/nginx/), así que este archivo solo se usa al correr la
# imagen suelta, sin montajes.

map $http_x_forwarded_proto $fwd_proto {
    default            $scheme;
    "~*^(https|http)$" $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /srv;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/xml application/xml text/javascript image/svg+xml;

    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://bf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
    }

    # Buzón de soporte: el script de diagnóstico publica sus logs aquí y la API
    # los reenvía al buzón real. Ruta propia fuera de /api a propósito.
    location = /v0/api/logs {
        proxy_pass http://bf-api:8080/api/logs/upload$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 10m;
        proxy_read_timeout 300s;
    }

    location /hubs/ {
        proxy_pass http://bf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # La página que nombra los archivos de la versión: el navegador debe preguntar
    # cada vez si cambió, o tras una actualización sigue cargando la anterior
    # (visto el 12-nov-2026). Los demás archivos cambian de nombre en cada versión
    # y se pueden guardar. Las rutas de la SPA llegan aquí por el try_files de abajo.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
