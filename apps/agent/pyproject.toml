[project]
name = "bot-factory-agent"
version = "0.1.0"
description = "LiveKit voice worker: thin bridge between LiveKit, ElevenLabs STT/TTS, and .NET backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents==1.5.1",
  "livekit-plugins-silero==1.5.1",
  "livekit-plugins-elevenlabs==1.5.1",
  "livekit-plugins-turn-detector==1.5.1",
  "httpx>=0.27,<0.29",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_factory_agent"]
